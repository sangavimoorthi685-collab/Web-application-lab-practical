<!DOCTYPE html>
<html>
<head>
    <title>React To-Do List</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .app {
            text-align: center;
            padding: 40px;
        }

        .card {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px gray;
        }

        input {
            padding: 10px;
            width: 220px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        li {
            margin: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function Todo() {

    const [task, setTask] = React.useState("");
    const [tasks, setTasks] = React.useState([]);

    function addTask() {

        if (task != "") {

            setTasks([...tasks, task]);

            setTask("");
        }
    }

    return (
        <div className="card">

            <h2>To-Do List</h2>

            <input
                type="text"
                placeholder="Enter task"
                value={task}
                onChange={(e) => setTask(e.target.value)}
            />

            <button onClick={addTask}>
                Add
            </button>

            <ul>

                {tasks.map((item, index) => (
                    <li key={index}>
                        {item}
                    </li>
                ))}

            </ul>

        </div>
    );
}

function App() {

    return (
        <div className="app">

            <h1>React To-Do Application</h1>

            <Todo />

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
