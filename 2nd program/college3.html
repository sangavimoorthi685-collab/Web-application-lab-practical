<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef5ff;
            margin: 0;
        }

        header {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .form-box {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid darkblue;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        footer {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Registration</h1>
        <p>ABC College of Technology</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Students</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <div class="form-box">

        <h2>Registration Form</h2>

        <form>

            <label>Student Name:</label>
            <input type="text">

            <label>Email:</label>
            <input type="email">

            <label>Age:</label>
            <input type="number">

            <label>Course:</label>

            <select>
                <option>B.Sc Computer Science</option>
                <option>BCA</option>
                <option>B.Sc Data Science</option>
                <option>B.Sc AI</option>
            </select>

            <label>Phone Number:</label>
            <input type="tel">

            <button type="submit">Register</button>

        </form>

    </div>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>

</body>
</html>
