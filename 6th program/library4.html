<!DOCTYPE html>
<html>
<head>
    <title>React Course</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f5f9;
            text-align: center;
            padding: 40px;
        }

        .card {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #9333ea;
        }

        h2 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        .count {
            font-size: 35px;
            font-weight: bold;
            color: #9333ea;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #9333ea;
            color: white;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function Course(props) {

    const [students, setStudents] = React.useState(10);

    function addStudent() {
        setStudents(students + 1);
    }

    function removeStudent() {
        if (students > 0) {
            setStudents(students - 1);
        }
    }

    function reset() {
        setStudents(10);
    }

    return (
        <div className="card">

            <h2>Course Information</h2>

            <p><b>Course:</b> {props.course}</p>
            <p><b>Department:</b> {props.department}</p>
            <p><b>Duration:</b> {props.duration}</p>

            <hr />

            <h2>Number of Students</h2>

            <p className="count">{students}</p>

            <button onClick={addStudent}>Add</button>
            <button onClick={removeStudent}>Remove</button>
            <button onClick={reset}>Reset</button>

        </div>
    );
}

function App() {

    return (
        <div>

            <h1>React Course Application</h1>

            <Course
                course="Python Programming"
                department="Computer Science"
                duration="3 Months"
            />

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
